<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · STACKLY</title>
  <!-- Google Fonts: Inter & Playfair Display for premium feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d3b2e; /* Deep green from STACKLY brand */
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* --- Animated Background Blobs --- */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
      z-index: 0;
      animation: floatBlob 12s ease-in-out infinite;
    }

    .blob-1 {
      width: 500px;
      height: 500px;
      background: #d4e84c; /* Lime */
      top: -150px;
      right: -100px;
      animation-delay: 0s;
    }

    .blob-2 {
      width: 400px;
      height: 400px;
      background: #42a5f5;
      bottom: -120px;
      left: -80px;
      animation-delay: -4s;
    }

    .blob-3 {
      width: 300px;
      height: 300px;
      background: #a8e6cf;
      top: 40%;
      left: 30%;
      animation-delay: -8s;
      opacity: 0.15;
    }

    @keyframes floatBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.1); }
      66% { transform: translate(-20px, 30px) scale(0.9); }
    }

    /* --- Main Container --- */
    .error-container {
      position: relative;
      z-index: 2;
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    /* --- Floating 404 Number with Glow --- */
    .error-code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(8rem, 28vw, 16rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      color: #ffffff;
      text-shadow: 0 0 40px rgba(212, 232, 76, 0.4), 0 0 80px rgba(212, 232, 76, 0.2);
      animation: floatNumber 4s ease-in-out infinite, glowPulse 3s ease-in-out infinite alternate;
      margin-bottom: 10px;
      position: relative;
    }

    .error-code span {
      color: #d4e84c; /* Lime accent */
      display: inline-block;
      animation: bounceLetter 2s ease-in-out infinite;
    }

    .error-code span:nth-child(1) { animation-delay: 0s; }
    .error-code span:nth-child(2) { animation-delay: 0.2s; }
    .error-code span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes floatNumber {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes glowPulse {
      0% { text-shadow: 0 0 30px rgba(212, 232, 76, 0.3), 0 0 60px rgba(212, 232, 76, 0.1); }
      100% { text-shadow: 0 0 50px rgba(212, 232, 76, 0.6), 0 0 100px rgba(212, 232, 76, 0.3); }
    }

    @keyframes bounceLetter {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* --- Animated Divider Line --- */
    .divider {
      width: 80px;
      height: 3px;
      background: #d4e84c;
      border-radius: 4px;
      margin: 20px auto 30px;
      animation: expandLine 1.5s ease-out forwards;
      transform-origin: center;
      box-shadow: 0 0 20px rgba(212, 232, 76, 0.5);
    }

    @keyframes expandLine {
      0% { width: 0; opacity: 0; }
      100% { width: 80px; opacity: 1; }
    }

    /* --- Error Message --- */
    .error-message {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
      animation: fadeInUp 1s ease-out 0.3s both;
    }

    .error-description {
      font-size: 1.1rem;
      color: #b6d0c2;
      max-width: 500px;
      margin: 0 auto 40px;
      line-height: 1.6;
      font-weight: 300;
      animation: fadeInUp 1s ease-out 0.5s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- Button Group --- */
    .btn-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeInUp 1s ease-out 0.7s both;
    }

    .btn-home {
      background: #d4e84c;
      color: #0d3b2e;
      padding: 16px 40px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px -8px rgba(212, 232, 76, 0.4);
    }

    .btn-home:hover {
      background: #c4d93a;
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -10px rgba(212, 232, 76, 0.5);
    }

    .btn-home i {
      transition: transform 0.3s;
    }

    .btn-home:hover i {
      transform: translateX(4px);
    }

    .btn-back {
      background: transparent;
      border: 1.5px solid rgba(212, 232, 76, 0.5);
      color: #d4e84c;
      padding: 16px 40px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
    }

    .btn-back:hover {
      background: rgba(212, 232, 76, 0.1);
      border-color: #d4e84c;
      transform: translateY(-4px);
    }

    /* --- Subtle Floating Icon (Search/Compass) --- */
    .floating-icon {
      position: absolute;
      font-size: 2rem;
      color: rgba(212, 232, 76, 0.15);
      animation: floatIcon 8s ease-in-out infinite;
      pointer-events: none;
    }

    .icon-1 {
      top: 10%;
      left: 8%;
      animation-delay: 0s;
    }

    .icon-2 {
      bottom: 15%;
      right: 10%;
      font-size: 3rem;
      animation-delay: -3s;
      color: rgba(66, 165, 245, 0.1);
    }

    .icon-3 {
      top: 20%;
      right: 15%;
      font-size: 1.8rem;
      animation-delay: -5s;
      color: rgba(212, 232, 76, 0.12);
    }

    @keyframes floatIcon {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(15px, -20px) rotate(5deg); }
      50% { transform: translate(-10px, 10px) rotate(-3deg); }
      75% { transform: translate(20px, 15px) rotate(4deg); }
    }

    /* --- Brand Logo (top-left) --- */
    .brand-logo {
      position: absolute;
      top: 30px;
      left: 40px;
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      z-index: 10;
      animation: fadeIn 1.2s ease-out;
    }

    .brand-logo span {
      color: #d4e84c;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .brand-logo {
        top: 20px;
        left: 20px;
        font-size: 1.3rem;
      }

      .error-code {
        font-size: clamp(6rem, 30vw, 10rem);
      }

      .error-message {
        font-size: 1.5rem;
      }

      .error-description {
        font-size: 0.95rem;
        padding: 0 10px;
      }

      .btn-group {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }

      .btn-home, .btn-back {
        width: 100%;
        justify-content: center;
        padding: 14px 24px;
      }

      .blob-1 { width: 300px; height: 300px; top: -80px; right: -80px; }
      .blob-2 { width: 250px; height: 250px; bottom: -60px; left: -60px; }
      .blob-3 { width: 200px; height: 200px; }
    }

    @media (max-width: 480px) {
      .error-code {
        font-size: 6rem;
      }

      .error-message {
        font-size: 1.2rem;
      }

      .divider {
        width: 60px;
      }

      .brand-logo {
        font-size: 1.1rem;
      }
    }

    /* --- Entrance Animation for Container --- */
    .error-container {
      animation: containerEntrance 1.2s cubic-bezier(0.23, 1, 0.32, 1) both;
    }

    @keyframes containerEntrance {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- Brand Logo (top-left) -->
  <div class="brand-logo">
    <img src="images/logo.webp" alt="STACKLY Logo" style="height: 44px; width: auto; display: block; filter: brightness(0) invert(1);">
  </div>

  <!-- Animated Background Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Floating Decorative Icons -->
  <div class="floating-icon icon-1"><i class="fas fa-compass"></i></div>
  <div class="floating-icon icon-2"><i class="fas fa-chart-pie"></i></div>
  <div class="floating-icon icon-3"><i class="fas fa-search"></i></div>

  <!-- Main Error Content -->
  <div class="error-container">
    <!-- 404 Number with animated letters -->
    <div class="error-code">
      <span>4</span><span>0</span><span>4</span>
    </div>

    <!-- Animated divider -->
    <div class="divider"></div>

    <!-- Message -->
    <h1 class="error-message">This page is out of scope.</h1>
    <p class="error-description">
      The financial insight you're looking for doesn't exist or has been moved. 
      Let's get you back on track to smart scaling.
    </p>

    <!-- Buttons -->
    <div class="btn-group">
      <button onclick="history.back()" class="btn-home">
        <i class="fas fa-arrow-left"></i> Go Back
      </button>
      <a href="tel:9876543210" class="btn-back">
        <i class="fas fa-phone"></i> +91 98765 43210
      </a>
    </div>

    <!-- Company Location & Contact info -->
    <div style="margin-top: 28px; font-size: 0.85rem; color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;">
      <span><i class="fas fa-location-dot" style="color: #d4e84c;"></i> Salem, Tamil Nadu, India</span>
      <span>•</span>
      <span>STACKLY Technologies</span>
    </div>
  </div>

  <!-- Optional: Simple script to ensure smooth experience -->
  <script>
    // Add a subtle parallax effect on mouse move (desktop only)
    document.addEventListener('mousemove', (e) => {
      if (window.innerWidth < 768) return;
      
      const blobs = document.querySelectorAll('.blob');
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      
      blobs.forEach((blob, index) => {
        const speed = 1 + index * 0.3;
        blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
      });
    });
  </script>
</body>
</html>
